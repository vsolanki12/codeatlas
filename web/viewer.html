  }
  const tags = [];
  if (t.controller) tags.push(`<span class="ttag ttag-ctrl">controller: ${t.controller.name}</span>`);
  if (t.creates.length) tags.push(`<span class="ttag ttag-creates">${t.creates.length} creates</span>`);
  if (t.tests.length) tags.push(`<span class="ttag ttag-tests">${t.tests.length} tests</span>`);
  if (t.functions.length) tags.push(`<span class="ttag ttag-funcs">${t.functions.length} functions</span>`);
  if (t.docs.length) tags.push(`<span class="ttag ttag-docs">${t.docs.length} docs</span>`);
  if (t.subComponents.length) tags.push(`<span class="ttag ttag-funcs">${t.subComponents.length} sub-components</span>`);
  const sub = t.controller
    ? `Managed by ${t.controller.package}`
    : '<span style="color:var(--muted)">No controller found</span>';
  return `<div class="topic-card" onclick="showTopicDetail('${t.crd.id.replace(/'/g, "\\'")}')">
    <h3>${t.crd.name}</h3>
    <div class="topic-sub">${sub}</div>
    <div class="topic-tags">${tags.join('')}</div>
  </div>`;
}

function showTopics() {
  currentView = 'topics';
  const content = document.getElementById('content');
  const q = document.getElementById('search').value.toLowerCase().trim();

  // Filter by group then search
  // Default view: hypershift CRDs + components
  let filtered;
  if (topicFilter === 'all') {
    filtered = topics;
  } else if (topicFilter === 'hypershift') {
    filtered = topics.filter(t => t.group === 'hypershift' || t.group === 'components');
  } else {
    filtered = topics.filter(t => t.group === topicFilter);
  }
  if (q) {
    filtered = filtered.filter(t => {
      const name = t.isComponent ? t.componentName.toLowerCase() : t.crd.name.toLowerCase();
      return name.includes(q) || (t.controller && t.controller.name.toLowerCase().includes(q));
    });
  }

  const groupLabels = { hypershift: 'HyperShift', platform: 'Platform', capi: 'Cluster API', karpenter: 'Karpenter', monitoring: 'Monitoring', openstack: 'OpenStack', 'install-assets': 'Install Assets', other: 'Other' };
  const groupOrder = ['hypershift', 'platform', 'capi', 'karpenter', 'monitoring', 'openstack', 'install-assets', 'other'];
  // Count components into hypershift for the tab
  const tabCounts = {};
  for (const t of topics) {
    const g = (t.group === 'components') ? 'hypershift' : t.group;
    tabCounts[g] = (tabCounts[g] || 0) + 1;
  }

  let html = '<div class="topics-header"><h2>HyperShift Architecture Topics</h2>';
  html += `<p>Click any topic to see its controller, resources, tests, and code.</p>`;
  html += '<div class="topic-filters">';
  html += `<button class="tf-btn ${topicFilter === 'all' ? 'active' : ''}" onclick="setTopicFilter('all')">All<span class="tf-cnt">${topics.length}</span></button>`;
  for (const g of groupOrder) {
    if (!tabCounts[g]) continue;
    html += `<button class="tf-btn ${topicFilter === g ? 'active' : ''}" onclick="setTopicFilter('${g}')">${groupLabels[g]}<span class="tf-cnt">${tabCounts[g]}</span></button>`;
  }
  html += '</div></div>';

  // Split into CRDs with controllers, components, and empty CRDs
  const withCtrl = filtered.filter(t => !t.isComponent && t.controller);
  const components = filtered.filter(t => t.isComponent);
  const withoutCtrl = filtered.filter(t => !t.isComponent && !t.controller);

  // CRDs with controllers
  if (withCtrl.length > 0) {
    html += '<div class="topics-grid">';
    for (const t of withCtrl) {
      html += renderTopicCard(t);
    }
    html += '</div>';
  }

  // Components section
  if (components.length > 0) {
    html += '<div class="topics-header" style="padding-top:20px"><h3 style="font-size:1.1rem;color:var(--cyan)">Control Plane Components</h3>';
    html += '<p style="color:var(--muted);font-size:0.85rem">Sub-packages managed by HostedControlPlaneReconciler — the actual workloads running in the control plane.</p></div>';
    html += '<div class="topics-grid">';
    for (const t of components) {
      html += renderTopicCard(t);
    }
    html += '</div>';
  }

  // Empty CRDs (collapsed)
  if (withoutCtrl.length > 0) {
    html += '<div class="topics-header" style="padding-top:20px">';
    html += `<details><summary style="cursor:pointer;color:var(--muted);font-size:0.9rem">Other CRDs without controllers (${withoutCtrl.length})</summary></details></div>`;
    html += '<div class="topics-grid" id="empty-crds" style="display:none">';
    for (const t of withoutCtrl) {
      html += renderTopicCard(t);
    }
    html += '</div>';
    // wire up the details toggle
    setTimeout(() => {
      const det = document.querySelector('.topics-header details');
      if (det) det.addEventListener('toggle', () => {
        const grid = document.getElementById('empty-crds');
        if (grid) grid.style.display = det.open ? 'grid' : 'none';
      });
    }, 0);
  }

  content.innerHTML = html;
  content.scrollTop = 0;
}

function showTopicDetail(crdId) {
  const topic = topics.find(t => t.crd.id === crdId);
  if (!topic) return;
  pushNav(() => showTopics());
  const content = document.getElementById('content');
  const crd = topic.crd;

  let html = '<div class="topic-detail">';
  html += `<button class="back-btn" onclick="showTopics()">Back to topics</button>`;

  // Header
  html += `<div class="td-header">
    <h2>${crd.name} <span class="kind-tag kind-crd">CRD</span></h2>
    <div class="td-id">${crd.id}</div>
  </div>`;

  // Auto-generated description
  html += '<div class="td-section"><h3>Overview</h3>';
  html += '<div class="doc-toc">';
  html += buildCrdOverview(topic);
  html += '</div></div>';

  // Onboarding guide references
  const topicDocRefs = findDocRefsForTopic(topic);
  if (topicDocRefs.length > 0) {
    html += `<div class="td-section"><h3>Onboarding Guide <span class="sec-count">(${topicDocRefs.length} references)</span></h3>`;
    for (const ref of topicDocRefs) {
      html += `<div class="doc-callout" style="border-left-color:var(--accent);background:rgba(88,166,255,0.06)" onclick="showDocPage('${ref.docId}')">
        <div class="doc-callout-title" style="color:var(--accent)">${ref.docTitle}</div>
        <div style="font-size:0.85rem;color:var(--muted);margin-top:4px">${ref.sections.join(' · ')}</div>
      </div>`;
    }
    html += '</div>';
  }

  // Relationship flow diagram
  if (TOPIC_FLOWS[crd.id]) {
    html += renderTopicFlow(crd.id);
  } else {
    html += buildFlowDiagram(topic);
  }

  // Sub-components (discovered from directory structure)
  if (topic.subComponents.length > 0) {
    html += `<div class="td-section"><h3>Sub-Components <span class="sec-count">(${topic.subComponents.length} packages managed by this controller)</span></h3>`;
    html += '<div class="subcomp-grid">';
    const colors = ['var(--red)', 'var(--orange)', 'var(--accent)', 'var(--purple)', 'var(--cyan)', 'var(--green)'];
    for (let i = 0; i < topic.subComponents.length; i++) {
      const sc = topic.subComponents[i];
      const color = colors[i % colors.length];
      const stats = [];
      if (sc.functions) stats.push(`${sc.functions} funcs`);
      if (sc.tests) stats.push(`${sc.tests} tests`);
      if (sc.resources) stats.push(`${sc.resources} resources`);
      const ctrlDir = topic.controller.source.file.substring(0, topic.controller.source.file.lastIndexOf('/') + 1);
      const scPath = ctrlDir + sc.name;
      html += `<div class="subcomp-card" onclick="showSubComponent('${scPath.replace(/'/g, "\\'")}', '${sc.name}')">
        <div class="sc-name">${sc.name}</div>
        <div class="sc-stats">${stats.join(' · ')}</div>
        <div class="sc-bar"><div class="sc-bar-fill" style="width:${Math.min(100, sc.total / 2)}%;background:${color}"></div></div>
      </div>`;
    }
    html += '</div></div>';
  }

  // Source + GitHub link
  html += '<div class="td-section"><h3>Source</h3>';
  const crdGhUrl = 'https://github.com/openshift/hypershift/blob/main/' + crd.source.file;
  html += `<div class="prop-grid">
    <span class="prop-key">CRD YAML</span><span class="prop-val"><a href="${crdGhUrl}" target="_blank" style="color:var(--accent)">${crd.source.file}</a></span>
    <span class="prop-key">Package</span><span class="prop-val">${crd.package || 'N/A'}</span>`;
  if (topic.controller) {
    const ctrlGhUrl = 'https://github.com/openshift/hypershift/blob/main/' + topic.controller.source.file;
    html += `<span class="prop-key">Controller</span><span class="prop-val"><a href="${ctrlGhUrl}" target="_blank" style="color:var(--accent)">${topic.controller.source.file}:${topic.controller.source.line}</a></span>`;
  }
  html += '</div></div>';

  // Docs (promoted above functions — most useful for learning)
  if (topic.docs.length > 0) {
    html += `<div class="td-section"><h3>Related Documentation <span class="sec-count">(${topic.docs.length})</span></h3>`;
    const opKeywords = ['recovery', 'backup', 'restore', 'troubleshoot', 'disaster', 'debug'];
    for (const e of topic.docs) {
      const docGhUrl = 'https://github.com/openshift/hypershift/blob/main/' + e.source.file;
      const isOp = opKeywords.some(k => e.name.toLowerCase().includes(k) || e.source.file.toLowerCase().includes(k));
      const headings = e.description ? e.description.split('; ').filter(h => h.trim()).slice(0, 6) : [];
      const content = e.content || '';
      html += `<div class="doc-callout${isOp ? ' operational' : ''}" onclick="showEntityDetail('${e.id.replace(/'/g, "\\'")}')">
        <div class="doc-callout-title">${e.name}${isOp ? ' <span style="font-size:0.7rem;padding:2px 8px;background:rgba(210,153,34,0.15);color:var(--orange);border-radius:4px;margin-left:6px">operational</span>' : ''}</div>
        <div class="doc-callout-meta"><a href="${docGhUrl}" target="_blank" style="color:var(--accent)" onclick="event.stopPropagation()">${e.source.file}</a></div>
        ${content ? `<div style="font-size:0.88rem;color:var(--text);margin-top:8px;line-height:1.6;opacity:0.85">${content}</div>` : ''}
        ${headings.length > 0 ? '<div class="doc-callout-headings" style="margin-top:6px">' + headings.map(h => '<span style="margin-right:8px">· ' + h + '</span>').join('') + '</div>' : ''}
      </div>`;
    }
    html += '</div>';
  }

  // Functions (collapsible, documented first)
  html += renderEntityList(topic.functions, 'functions');

  // Tests (collapsible)
  html += renderEntityList(topic.tests, 'tests');

  html += '</div>';
  content.innerHTML = html;
  content.scrollTop = 0;

  if (typeof mermaid !== 'undefined' && TOPIC_FLOWS[crd.id]) {
    setTimeout(() => {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        themeVariables: {
          darkMode: true,
          background: '#161b22',
          primaryColor: '#1c2128',
          primaryTextColor: '#e6edf3',
          primaryBorderColor: '#30363d',
          lineColor: '#8b949e',
          secondaryColor: '#1c2128',
          tertiaryColor: '#0d1117',
          fontFamily: '-apple-system, BlinkMacSystemFont, sans-serif',
          fontSize: '14px',
          nodeTextColor: '#e6edf3'
        },
        flowchart: { htmlLabels: true, curve: 'basis' }
      });
      mermaid.run({ nodes: document.querySelectorAll('.topic-flow-mermaid') })
        .then(() => wireFlowNodes(crd.id)).catch(() => {});
    }, 50);
  }
}

function buildCrdOverview(topic) {
  const crd = topic.crd;
  const apiGroup = crd.id.replace('crd:', '').split('.').slice(1).join('.');
  let html = '';

  // Description block
  if (crd.description) {
    html += `<div style="padding:14px 18px;background:rgba(88,166,255,0.06);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;margin-bottom:16px;font-size:0.95rem;line-height:1.6;color:var(--text)">${crd.description}</div>`;
  }
  html += `<p style="margin-bottom:16px;font-size:0.9rem;color:var(--muted)">Custom Resource Definition in the <code style="background:var(--surface);padding:2px 6px;border-radius:3px;color:var(--cyan)">${apiGroup || crd.package}</code> API group.</p>`;

  // Info grid
  html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';

  // Controller card
  if (topic.controller) {
    const c = topic.controller;
    html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin-bottom:8px;font-weight:600">Controller</div>
      <div style="font-weight:600;font-size:0.95rem;margin-bottom:4px">${c.name}</div>
      <div style="font-family:monospace;font-size:0.8rem;color:var(--muted)">${c.package} / ${c.source.file.split('/').pop()}</div>
      ${c.description ? `<div style="font-size:0.85rem;color:var(--text);margin-top:6px;font-style:italic">${c.description}</div>` : ''}
    </div>`;
  }

  // Creates card
  if (topic.creates.length > 0) {
    const tags = topic.creates.map(e => `<span style="display:inline-block;padding:3px 10px;background:rgba(210,153,34,0.1);color:var(--orange);border-radius:4px;font-size:0.8rem;font-weight:500">${e.name}</span>`).join(' ');
    html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--orange);margin-bottom:8px;font-weight:600">Creates / Owns</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${tags}</div>
    </div>`;
  }

  // Watches card
  if (topic.controller && topic.controller.watches && topic.controller.watches.length > 0) {
    const tags = topic.controller.watches.map(w => `<span style="display:inline-block;padding:3px 10px;background:rgba(188,140,255,0.1);color:var(--purple);border-radius:4px;font-size:0.8rem;font-weight:500">${w}</span>`).join(' ');
    html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--purple);margin-bottom:8px;font-weight:600">Watches</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${tags}</div>
    </div>`;
  }

  // Sub-components card
  if (topic.subComponents && topic.subComponents.length > 0) {
    const tags = topic.subComponents.slice(0, 10).map(s => `<span style="display:inline-block;padding:3px 10px;background:rgba(57,210,192,0.1);color:var(--cyan);border-radius:4px;font-size:0.8rem;font-weight:500">${s.name}</span>`).join(' ');
    const more = topic.subComponents.length > 10 ? `<span style="color:var(--muted);font-size:0.8rem;margin-left:4px">+${topic.subComponents.length - 10} more</span>` : '';
    html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:8px;font-weight:600">Sub-Components (${topic.subComponents.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${tags}${more}</div>
    </div>`;
  }

  // Code stats card
  const documented = topic.functions.filter(f => f.description).length;
  const coverage = topic.functions.length > 0 ? Math.round(documented / topic.functions.length * 100) : 0;
  html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
    <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--green);margin-bottom:8px;font-weight:600">Package Stats</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${topic.functions.length ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--accent)">${topic.functions.length}</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">functions</span></div>` : ''}
      ${topic.tests.length ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--purple)">${topic.tests.length}</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">tests</span></div>` : ''}
      ${topic.docs.length ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--green)">${topic.docs.length}</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">docs</span></div>` : ''}
      ${documented ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--text)">${coverage}%</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">documented</span></div>` : ''}
    </div>
  </div>`;

  // Also referenced by
  const otherRefs = (relsTo[crd.id] || []).filter(r => r.from !== (topic.controller ? topic.controller.id : ''));
  if (otherRefs.length > 0) {
    const refNames = [...new Set(otherRefs.map(r => byId[r.from]).filter(Boolean).map(e => e.name))];
    if (refNames.length > 0) {
      const tags = refNames.map(n => `<span style="display:inline-block;padding:3px 10px;background:rgba(139,148,158,0.1);color:var(--muted);border-radius:4px;font-size:0.8rem">${n}</span>`).join(' ');
      html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
        <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;font-weight:600">Also Referenced By</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">${tags}</div>
      </div>`;
    }
  }

  html += '</div>';
  return html;
}

let collapseCounter = 0;
function renderEntityList(items, title, defaultShow = 10) {
  if (!items || items.length === 0) return '';
  const documented = items.filter(e => e.description);
  const sorted = [...documented, ...items.filter(e => !e.description)];
  const docCount = documented.length;
  let html = `<div class="td-section"><h3 style="text-transform:capitalize">${title} <span class="sec-count">(${items.length}${docCount ? ', ' + docCount + ' documented' : ''})</span></h3>`;
  const id = 'collapse-' + (collapseCounter++);
  const visible = sorted.slice(0, defaultShow);
  const hidden = sorted.slice(defaultShow);
  for (const e of visible) {
    html += renderEntityCard(e);
  }
  if (hidden.length > 0) {
    html += `<div id="${id}" style="display:none">`;
    for (const e of hidden) {
      html += renderEntityCard(e);
    }
    html += '</div>';
    html += `<button class="show-more-btn" onclick="var el=document.getElementById('${id}');if(el.style.display==='none'){el.style.display='block';this.textContent='Show less';}else{el.style.display='none';this.textContent='Show all ${items.length} ${title}';}">Show all ${items.length} ${title}</button>`;
  }
  html += '</div>';
  return html;
}

function renderEntityCard(e) {
  const testRels = (relsFrom[e.id] || []).filter(r => r.type === 'tested_by');
  const tested = testRels.length > 0 ? `<span class="kind-tag kind-test">${testRels.length} test${testRels.length > 1 ? 's' : ''}</span>` : '';
  return `<div class="info-card" onclick="showEntityDetail('${e.id.replace(/'/g, "\\'")}')">
    <div class="ic-title">${e.name} <span class="kind-tag kind-${e.kind}">${e.kind}</span> ${tested}</div>
    <div class="ic-meta">${e.source.file.split('/').slice(-1)[0]}:${e.source.line}</div>
    ${e.description ? `<div class="ic-desc">${e.description}</div>` : ''}
  </div>`;
}

let _selectedFlowNode = null;

function renderTopicFlow(crdId) {
  const flow = TOPIC_FLOWS[crdId];
  if (!flow) return '';
  let html = '<div class="topic-flow">';
  html += `<div class="topic-flow-header"><h3>${flow.title || 'Reconciliation Flow'}</h3>`;
  html += `<p>${flow.intro}</p></div>`;
  html += `<div class="topic-flow-diagram"><pre class="mermaid topic-flow-mermaid">${flow.mermaid}</pre></div>`;
  html += '<div class="topic-flow-info" id="topic-flow-info"><span class="tfi-hint">Click any step in the diagram to see what it does</span></div>';
  html += '</div>';
  return html;
}

function wireFlowNodes(crdId) {
  const flow = TOPIC_FLOWS[crdId];
  if (!flow) return;
  _selectedFlowNode = null;
  const svg = document.querySelector('.topic-flow-diagram svg');
  if (!svg) return;
  svg.querySelectorAll('.node').forEach(node => {
    const elId = node.id || '';
    let nodeKey = null;
    for (const key of Object.keys(flow.nodes)) {
      if (elId.includes('flowchart-' + key + '-') || elId === 'flowchart-' + key) {
        nodeKey = key;
        break;
      }
    }
    if (!nodeKey) return;
    node.style.cursor = 'pointer';
    node.addEventListener('click', (ev) => {
      ev.stopPropagation();
      selectFlowNode(crdId, nodeKey, node);
    });
    node.addEventListener('mouseenter', () => {
      const shape = node.querySelector('rect, circle, polygon, .basic, path');
      if (shape && !node.dataset.flowSelected) {
        shape._origStroke = shape.getAttribute('stroke');
        shape.setAttribute('stroke', '#58a6ff');
        shape.setAttribute('stroke-width', '2');
      }
    });
    node.addEventListener('mouseleave', () => {
      const shape = node.querySelector('rect, circle, polygon, .basic, path');
      if (shape && !node.dataset.flowSelected) {
        shape.setAttribute('stroke', shape._origStroke || '');
        shape.setAttribute('stroke-width', '1');
      }
    });
  });
}

function selectFlowNode(crdId, nodeId, svgNode) {
  const flow = TOPIC_FLOWS[crdId];
  const info = flow.nodes[nodeId];
  if (!info) return;
  const panel = document.getElementById('topic-flow-info');
  if (!panel) return;

  // Unhighlight previous
  if (_selectedFlowNode) {
    _selectedFlowNode.dataset.flowSelected = '';
    const prevShape = _selectedFlowNode.querySelector('rect, circle, polygon, .basic, path');
    if (prevShape) {
      prevShape.setAttribute('stroke', prevShape._origStroke || '');
      prevShape.setAttribute('stroke-width', '1');
    }
  }

  // Highlight current
  if (svgNode) {
    svgNode.dataset.flowSelected = '1';
    const shape = svgNode.querySelector('rect, circle, polygon, .basic, path');
    if (shape) {
      shape._origStroke = shape._origStroke || shape.getAttribute('stroke');
      shape.setAttribute('stroke', '#58a6ff');
      shape.setAttribute('stroke-width', '3');
    }
    _selectedFlowNode = svgNode;
  }

  let html = '<div class="tfi-title">';
  html += `<span>${info.title}</span>`;
  const kindClass = 'tfi-kind-' + (info.kind || 'step');
  html += `<span class="tfi-kind ${kindClass}">${info.kind || 'step'}</span>`;
  if (info.componentName && COMPONENT_INFO[info.componentName]) {
    const ci = COMPONENT_INFO[info.componentName];
    const tc = TIER_COLORS[ci.tier] || TIER_COLORS[5];
    html += `<span class="comp-tier-badge" style="background:${tc.bg};color:${tc.text}">Tier ${ci.tier}: ${ci.tierLabel}</span>`;
    html += `<span style="font-size:0.75rem;color:var(--muted);margin-left:auto">Deploy order #${ci.order}</span>`;
  }
  html += '</div>';
  html += `<div class="tfi-desc">${info.desc}</div>`;

  // For component nodes: show dependencies
  if (info.componentName && COMPONENT_INFO[info.componentName]) {
    const ci = COMPONENT_INFO[info.componentName];
    if (ci.dependsOn && ci.dependsOn.length > 0) {
      html += '<div class="tfi-manages"><div class="tfi-manages-label" style="color:var(--orange)">Depends On (must be running first)</div><div class="tfi-manages-list">';
      for (const dep of ci.dependsOn) {
        html += `<span class="tfi-manages-item" style="background:rgba(210,153,34,0.1);color:var(--orange)" onclick="spineNavigate('resource:controlplanecomponent.${dep}')">${dep}</span>`;
      }
      html += '</div></div>';
    }
    const requiredBy = Object.entries(COMPONENT_INFO).filter(([_, c]) => c.dependsOn && c.dependsOn.includes(info.componentName)).map(([n]) => n);
    if (requiredBy.length > 0) {
      html += '<div class="tfi-manages"><div class="tfi-manages-label" style="color:var(--green)">Required By (depends on this)</div><div class="tfi-manages-list">';
      for (const dep of requiredBy) {
        html += `<span class="tfi-manages-item" style="background:rgba(63,185,80,0.1);color:var(--green)" onclick="spineNavigate('resource:controlplanecomponent.${dep}')">${dep}</span>`;
      }
      html += '</div></div>';
    }
    if (ci.impact) {
      html += `<div class="tfi-impact"><div class="tfi-impact-label">If this goes down</div><div class="tfi-impact-text">${ci.impact}</div></div>`;
    }
  }

  // Manages section
  if (info.manages && info.manages.length > 0) {
    html += '<div class="tfi-manages"><div class="tfi-manages-label">Manages</div><div class="tfi-manages-list">';
    for (const m of info.manages) {
      html += `<span class="tfi-manages-item" onclick="spineNavigate('${m.entityId.replace(/'/g, "\\'")}')">${m.label}</span>`;
    }
    html += '</div></div>';
  }

  // Related section
  if (info.related && info.related.length > 0) {
    html += '<div class="tfi-related"><div class="tfi-related-label">Related Topics</div><div class="tfi-related-list">';
    for (const r of info.related) {
      html += `<span class="tfi-related-item" onclick="showTopicDetailOrEntity('${r.entityId.replace(/'/g, "\\'")}')">${r.label}</span>`;
    }
    html += '</div></div>';
  }

  // Links
  const links = [];
  if (info.componentName && COMPONENT_INFO[info.componentName]) {
    const ci = COMPONENT_INFO[info.componentName];
    const dirPath = 'control-plane-operator/controllers/hostedcontrolplane/v2/' + ci.dir;
    links.push(`<span class="tfi-link" onclick="showSubComponent('${dirPath}', '${info.componentName.replace(/'/g, "\\'")}')">View component details &rarr;</span>`);
  }
  if (info.entityId) {
    const topic = topics.find(t => t.crd && t.crd.id === info.entityId);
    if (topic) {
      links.push(`<span class="tfi-link" onclick="showTopicDetail('${info.entityId.replace(/'/g, "\\'")}')">View topic</span>`);
    }
  }
  if (info.file) {
    const ghUrl = 'https://github.com/openshift/hypershift/blob/main/' + info.file;
    links.push(`<a class="tfi-link" href="${ghUrl}" target="_blank">View source on GitHub</a>`);
  }
  if (links.length > 0) {
    html += '<div class="tfi-links">' + links.join(' · ') + '</div>';
  }

  panel.innerHTML = html;
  panel.classList.add('has-content');
}

function buildFlowDiagram(topic) {
  const crd = topic.crd;
  let html = '<div class="rel-flow">';

  if (topic.controller) {
    const c = topic.controller;
    const reconcileRel = (relsTo[crd.id] || []).find(r => r.type === 'reconciles' && r.from === c.id);

    // Controller node
    html += `<div class="rf-node" onclick="showEntityDetail('${c.id.replace(/'/g, "\\'")}')">
      <span class="kind-tag kind-controller" style="margin:0">controller</span>
      <span class="rf-node-name">${c.name}</span>
    </div>`;

    // Arrow: reconciles
    html += '<div class="rf-arrow"><div class="rf-arrow-line"></div><span class="rf-arrow-label reconciles">reconciles</span>';
    if (reconcileRel && reconcileRel.evidence.snippet) {
      html += `<div class="rf-evidence" title="${reconcileRel.evidence.snippet}">${reconcileRel.evidence.snippet}</div>`;
    }
    html += '<div class="rf-arrow-line"></div><div class="rf-arrow-tip"></div></div>';

    // CRD node
    html += `<div class="rf-node" style="border-color:var(--orange)">
      <span class="kind-tag kind-crd" style="margin:0">CRD</span>
      <span class="rf-node-name">${crd.name}</span>
    </div>`;

    // Creates section (from watches edges)
    if (topic.creates.length > 0) {
      const createRels = (relsFrom[c.id] || []).filter(r => r.type === 'creates');
      html += '<div class="rf-arrow"><div class="rf-arrow-line"></div><span class="rf-arrow-label creates">creates</span>';
      if (createRels.length > 0 && createRels[0].evidence.snippet) {
        html += `<div class="rf-evidence" title="${createRels[0].evidence.snippet}">${createRels[0].evidence.snippet}</div>`;
      }
      html += '<div class="rf-arrow-line"></div><div class="rf-arrow-tip"></div></div>';

      html += '<div class="rf-creates-row">';
      for (const e of topic.creates) {
        html += `<div class="rf-node" onclick="showTopicDetailOrEntity('${e.id.replace(/'/g, "\\'")}')">
          <span class="kind-tag kind-${e.kind}" style="margin:0">${e.kind}</span>
          <span class="rf-node-name">${e.name}</span>
        </div>`;
      }
      html += '</div>';
    }

    // Sub-components (from directory structure)
    if (topic.subComponents && topic.subComponents.length > 0) {
      html += '<div class="rf-arrow"><div class="rf-arrow-line"></div><span class="rf-arrow-label creates">manages</span>';
      html += '<div class="rf-evidence">sub-packages in controller directory</div>';
      html += '<div class="rf-arrow-line"></div><div class="rf-arrow-tip"></div></div>';

      html += '<div class="rf-creates-row">';
      const ctrlDir = c.source.file.substring(0, c.source.file.lastIndexOf('/') + 1);
      for (const sc of topic.subComponents.slice(0, 12)) {
        const scPath = ctrlDir + sc.name;
        html += `<div class="rf-node" onclick="showSubComponent('${scPath.replace(/'/g, "\\'")}', '${sc.name}')" style="border-color:var(--cyan)">
          <span class="kind-tag kind-package" style="margin:0">${sc.name}</span>
          <span class="rf-node-name" style="font-size:0.8rem">${sc.functions} functions · ${sc.tests} tests</span>
        </div>`;
      }
      if (topic.subComponents.length > 12) {
        html += `<div class="rf-node" style="border-color:var(--border);cursor:default"><span class="rf-node-name" style="color:var(--muted);font-size:0.8rem">+${topic.subComponents.length - 12} more</span></div>`;
      }
      html += '</div>';
    }

    // Tests
    if (topic.tests.length > 0) {
      html += '<div class="rf-arrow"><div class="rf-arrow-line"></div><span class="rf-arrow-label tested_by">tested_by</span><div class="rf-arrow-line"></div><div class="rf-arrow-tip"></div></div>';
      html += `<div class="rf-node" style="border-color:var(--purple);cursor:default">
        <span class="kind-tag kind-test" style="margin:0">tests</span>
        <span class="rf-node-name">${topic.tests.length} tests in package</span>
      </div>`;
    }
    // Reconciliation steps from calls data
    if (c.calls && c.calls.length > 0) {
      html += '</div>'; // close rel-flow
      html += '<div class="td-section" style="margin-top:24px"><h3>Reconciliation Steps <span class="sec-count">(' + c.calls.length + ' calls extracted from Reconcile() body)</span></h3>';
      html += '<div class="recon-flow">';
      const callRels = (relsFrom[c.id] || []).filter(r => r.type === 'calls');
      const resolvedCalls = {};
      for (const r of callRels) {
        const target = byId[r.to];
        if (target) resolvedCalls[target.name] = target;
      }
      const internalCalls = [];
      const externalCalls = [];
      for (const name of c.calls) {
        const target = resolvedCalls[name];
        if (target && target.package === c.package) {
          internalCalls.push({ name, target });
        } else if (target) {
          externalCalls.push({ name, target });
        } else {
          internalCalls.push({ name, target: null });
        }
      }
      if (internalCalls.length > 0) {
        html += '<div style="width:100%;margin-bottom:4px"><span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--red);font-weight:600">Internal (' + c.package + ')</span></div>';
        for (const call of internalCalls) {
          if (call.target) {
            html += `<div class="recon-step internal" onclick="showEntityDetail('${call.target.id.replace(/'/g, "\\'")}')">${call.name}</div>`;
          } else {
            html += `<div class="recon-step unresolved" title="Not resolved to a graph entity">${call.name}</div>`;
          }
        }
      }
      if (externalCalls.length > 0) {
        html += '<div style="width:100%;margin-top:8px;margin-bottom:4px"><span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);font-weight:600">External calls</span></div>';
        for (const call of externalCalls) {
          html += `<div class="recon-step external" onclick="showEntityDetail('${call.target.id.replace(/'/g, "\\'")}')">${call.name} <span style="font-size:0.7rem;color:var(--muted)">${call.target.package}</span></div>`;
        }
      }
      html += '</div></div>';
      return html;
    }
  } else {
    // No controller — just show the CRD
    html += `<div class="rf-node" style="border-color:var(--orange)">
      <span class="kind-tag kind-crd" style="margin:0">CRD</span>
      <span class="rf-node-name">${crd.name}</span>
    </div>`;
    html += '<div style="color:var(--muted);font-size:0.85rem;margin-top:12px">No controller relationship found</div>';
  }

  html += '</div>';
  return html;
}

function showTopicDetailOrEntity(id) {
  const entity = byId[id];
  if (!entity) return;
  if (entity.kind === 'crd') {
    const topic = topics.find(t => t.crd && t.crd.id === id);
    if (topic) { showTopicDetail(id); return; }
  }
  if (entity.kind === 'controller') {
    const topic = topics.find(t => t.controller && t.controller.id === id);
    if (topic) { showTopicDetail(topic.crd.id); return; }
  }
  showEntityDetail(id);
}

// ==================== SUB-COMPONENT VIEW ====================

function showSubComponent(dirPath, name) {
  const prefix = dirPath + '/';
  const coreEntities = graph.entities.filter(e => e.source.file.startsWith(prefix));
  const nameLower = name.toLowerCase();
  const relatedResources = graph.entities.filter(e =>
    (e.kind === 'resource') && !e.source.file.startsWith(prefix) &&
    (e.source.file.toLowerCase().includes('/testdata/' + nameLower + '/') ||
     e.source.file.toLowerCase().includes('/assets/' + nameLower + '/') ||
     e.source.file.toLowerCase().includes('/manifests/' + nameLower + '/'))
  );
  const relatedDocs = graph.entities.filter(e =>
    e.kind === 'document' && !e.source.file.startsWith(prefix) &&
    e.source.file.toLowerCase().includes(nameLower)
  );
  const entities = [...coreEntities, ...relatedResources, ...relatedDocs];
  const content = document.getElementById('content');
  const prevContent = content.innerHTML;
  pushNav(() => { content.innerHTML = prevContent; content.scrollTop = 0; });

  const byKind = {};
  for (const e of entities) {
    if (!byKind[e.kind]) byKind[e.kind] = [];
    byKind[e.kind].push(e);
  }

  const compInfo = COMPONENT_INFO[name];
  const controllers = byKind['controller'] || [];
  const funcs = byKind['function'] || [];
  const tests = byKind['test'] || [];
  const resources = byKind['resource'] || [];
  const docs = byKind['document'] || [];
  const ghUrl = 'https://github.com/openshift/hypershift/tree/main/' + dirPath;

  let html = '<div class="topic-detail">';
  html += `<button class="back-btn" onclick="goBack()">Back</button>`;

  if (compInfo) {
    // === LEARNING-FOCUSED LAYOUT for control plane components ===
    const tc = TIER_COLORS[compInfo.tier] || TIER_COLORS[5];
    html += `<div class="td-header">
      <h2 style="text-transform:capitalize">${name}
        <span class="comp-tier-badge" style="background:${tc.bg};color:${tc.text}">Tier ${compInfo.tier}: ${compInfo.tierLabel}</span>
        <span style="font-size:0.78rem;color:var(--muted);font-weight:400;margin-left:8px">Deploy order #${compInfo.order} of ${Object.keys(COMPONENT_INFO).length}</span>
      </h2>
      <div class="td-id" style="cursor:pointer;color:var(--accent)" onclick="showTopicDetail('crd:hypershift.openshift.io.hostedcontrolplane')">
        &larr; Back to HostedControlPlane hierarchy
      </div>
    </div>`;

    // 1. What is this component?
    html += '<div class="td-section"><h3>What is this?</h3>';
    html += `<div style="padding:14px 18px;background:rgba(88,166,255,0.06);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;margin-bottom:16px;font-size:0.95rem;line-height:1.7;color:var(--text)">${compInfo.desc}</div>`;
    html += `<p style="font-size:0.88rem;color:var(--muted)">Managed by the <span style="color:var(--accent);cursor:pointer" onclick="showTopicDetail('crd:hypershift.openshift.io.hostedcontrolplane')">Control Plane Operator (CPO)</span>. The CPO deploys this as a Kubernetes workload in the hosted cluster's control plane namespace on the management cluster.</p>`;
    html += '</div>';

    // 2. Dependency chain — where does this sit?
    html += '<div class="td-section"><h3>Where does it fit?</h3>';
    const depChain = buildDepChain(name);
    html += '<div class="dep-chain">';
    for (let i = 0; i < depChain.length; i++) {
      const cn = depChain[i];
      const isCurrent = cn === name;
      const ci = COMPONENT_INFO[cn];
      const ctc = TIER_COLORS[ci ? ci.tier : 5] || TIER_COLORS[5];
      if (i > 0) html += '<span class="dep-chain-arrow">&rarr;</span>';
      html += `<span class="dep-chain-node${isCurrent ? ' current' : ''}" style="${isCurrent ? '' : 'cursor:pointer'}" ${isCurrent ? '' : `onclick="spineNavigate('resource:controlplanecomponent.${cn}')"`}>${cn.replace('control-plane-pki-operator','PKI').replace('kube-apiserver','KAS').replace('kube-controller-manager','KCM').replace('kube-scheduler','Scheduler').replace('openshift-apiserver','OCP API').replace('oauth-openshift','OAuth').replace('cluster-version-operator','CVO').replace('cluster-network-operator','CNO').replace('cloud-credential-operator','CCO').replace('cluster-storage-operator','Storage').replace('cluster-autoscaler','Autoscaler').replace('dns-operator','DNS').replace('ingress-operator','Ingress').replace('ignition-server','Ignition').replace('olm-operator','OLM').replace('cluster-policy-controller','Policy')}</span>`;
    }
    html += '</div>';
    html += `<p style="font-size:0.82rem;color:var(--muted);margin-top:8px">Dependency chain reads left to right: each component must be running before the next one can start.</p>`;
    html += '</div>';

    // 3. Dependencies and Dependents
    html += '<div class="td-section"><h3>Dependencies</h3>';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';

    // Depends on
    html += '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">';
    html += '<div class="comp-section-label" style="color:var(--orange)">Requires (must be running first)</div>';
    if (compInfo.dependsOn.length === 0) {
      html += '<div style="font-size:0.88rem;color:var(--muted);font-style:italic">No dependencies — this is a root component</div>';
    } else {
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      for (const dep of compInfo.dependsOn) {
        html += `<span style="padding:6px 12px;background:rgba(210,153,34,0.1);color:var(--orange);border-radius:6px;font-size:0.85rem;cursor:pointer;font-weight:600" onclick="spineNavigate('resource:controlplanecomponent.${dep}')">${dep}</span>`;
      }
      html += '</div>';
    }
    html += '</div>';

    // Required by
    const requiredBy = Object.entries(COMPONENT_INFO).filter(([_, c]) => c.dependsOn && c.dependsOn.includes(name)).map(([n]) => n);
    html += '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">';
    html += '<div class="comp-section-label" style="color:var(--green)">Required By (depends on this)</div>';
    if (requiredBy.length === 0) {
      html += '<div style="font-size:0.88rem;color:var(--muted);font-style:italic">No other components directly depend on this</div>';
    } else {
      html += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      for (const dep of requiredBy) {
        html += `<span style="padding:6px 12px;background:rgba(63,185,80,0.1);color:var(--green);border-radius:6px;font-size:0.85rem;cursor:pointer;font-weight:600" onclick="spineNavigate('resource:controlplanecomponent.${dep}')">${dep}</span>`;
      }
      html += '</div>';
    }
    html += '</div>';
    html += '</div>';

    // Impact
    if (compInfo.impact) {
      html += `<div class="tfi-impact" style="margin-top:12px"><div class="tfi-impact-label">If ${name} goes down</div><div class="tfi-impact-text">${compInfo.impact}</div></div>`;
    }
    html += '</div>';

    // 4. Sibling components (same tier)
    const siblings = Object.entries(COMPONENT_INFO).filter(([n, c]) => c.tier === compInfo.tier && n !== name);
    if (siblings.length > 0) {
      html += `<div class="td-section"><h3>Same Tier: ${compInfo.tierLabel} <span class="sec-count">(${siblings.length} others)</span></h3>`;
      html += '<div style="display:flex;flex-wrap:wrap;gap:8px">';
      for (const [sn, sc] of siblings) {
        const stc = TIER_COLORS[sc.tier] || TIER_COLORS[5];
        html += `<div style="padding:8px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all 0.12s;display:flex;flex-direction:column;gap:2px;min-width:140px" onclick="spineNavigate('resource:controlplanecomponent.${sn}')" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
          <span style="font-weight:600;font-size:0.88rem;text-transform:capitalize">${sn}</span>
          <span style="font-size:0.75rem;color:var(--muted)">#${sc.order}</span>
        </div>`;
      }
      html += '</div></div>';
    }

    // 5. Controller (the Go code that reconciles this component)
    if (controllers.length > 0) {
      html += '<div class="td-section"><h3>Controller</h3>';
      html += `<p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">The Go code that reconciles this component. It creates, updates, or deletes the Kubernetes resources (Deployment, Service, ConfigMap, etc.) that make ${name} run.</p>`;
      for (const c of controllers) {
        html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;cursor:pointer" onclick="showEntityDetail('${c.id.replace(/'/g, "\\'")}')">
          <div style="font-weight:600;font-size:0.95rem;margin-bottom:4px">${c.name}</div>
          <div style="font-family:monospace;font-size:0.8rem;color:var(--muted)">${c.source.file.split('/').pop()}:${c.source.line}</div>
          ${c.description ? `<div style="font-size:0.85rem;color:var(--text);margin-top:6px">${c.description}</div>` : ''}
        </div>`;
      }
      html += '</div>';
    }

    // 6. Key Functions — the implementation logic
    const docFuncs = funcs.filter(f => f.description);
    const otherFuncs = funcs.filter(f => !f.description);
    if (funcs.length > 0) {
      html += `<div class="td-section"><h3>Implementation <span class="sec-count">(${funcs.length} functions, ${tests.length} tests)</span></h3>`;
      html += `<p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">Go functions that implement ${name}'s logic. Documented functions are shown first — these are the key entry points and operations.</p>`;
      if (docFuncs.length > 0) {
        for (const f of docFuncs.slice(0, 10)) {
          html += `<div class="info-card" onclick="showEntityDetail('${f.id.replace(/'/g, "\\'")}')">
            <div class="ic-title">${f.name} <span class="kind-tag kind-function">function</span></div>
            <div class="ic-meta">${f.source.file.split('/').pop()}:${f.source.line}</div>
            <div class="ic-desc">${f.description}</div>
          </div>`;
        }
      }
      if (otherFuncs.length > 0) {
        const fid = 'other-funcs-' + name.replace(/[^a-z0-9]/gi, '');
        html += `<button class="res-toggle" onclick="var el=document.getElementById('${fid}');if(el.classList.contains('res-collapsed')){el.classList.remove('res-collapsed');this.textContent='Hide ${otherFuncs.length} more functions';}else{el.classList.add('res-collapsed');this.textContent='Show ${otherFuncs.length} more functions';}">${docFuncs.length > 0 ? `Show ${otherFuncs.length} more functions` : `Show all ${otherFuncs.length} functions`}</button>`;
        html += `<div id="${fid}" class="res-collapsed" style="margin-top:8px">`;
        for (const f of otherFuncs) {
          html += `<div class="info-card" onclick="showEntityDetail('${f.id.replace(/'/g, "\\'")}')">
            <div class="ic-title">${f.name} <span class="kind-tag kind-function">function</span></div>
            <div class="ic-meta">${f.source.file.split('/').pop()}:${f.source.line}</div>
          </div>`;
        }
        html += '</div>';
      }
      if (tests.length > 0) {
        const tid = 'tests-' + name.replace(/[^a-z0-9]/gi, '');
        html += `<button class="res-toggle" style="margin-top:8px" onclick="var el=document.getElementById('${tid}');if(el.classList.contains('res-collapsed')){el.classList.remove('res-collapsed');this.textContent='Hide ${tests.length} tests';}else{el.classList.add('res-collapsed');this.textContent='Show ${tests.length} tests';}">${`Show ${tests.length} tests`}</button>`;
        html += `<div id="${tid}" class="res-collapsed" style="margin-top:8px">`;
        for (const t of tests) {
          html += `<div class="info-card" onclick="showEntityDetail('${t.id.replace(/'/g, "\\'")}')">
            <div class="ic-title">${t.name} <span class="kind-tag kind-test">test</span></div>
            <div class="ic-meta">${t.source.file.split('/').pop()}:${t.source.line}</div>
          </div>`;
        }
        html += '</div>';
      }
      html += '</div>';
    }

    // 7. Kubernetes Resources — collapsed by default
    if (resources.length > 0) {
      const rid = 'resources-' + name.replace(/[^a-z0-9]/gi, '');
      html += `<div class="td-section"><h3>Kubernetes Resources <span class="sec-count">(${resources.length})</span></h3>`;
      html += `<p style="font-size:0.85rem;color:var(--muted);margin-bottom:12px">The actual Kubernetes objects this component creates on the management cluster — Deployments, Services, ConfigMaps, RBAC, etc. These are the YAML manifests that make ${name} run as a pod.</p>`;
      const resCats = {};
      const kindMap = { statefulset: 'Workloads', deployment: 'Workloads', daemonset: 'Workloads', job: 'Workloads', cronjob: 'Workloads', service: 'Networking', ingress: 'Networking', route: 'Networking', role: 'RBAC', rolebinding: 'RBAC', clusterrole: 'RBAC', clusterrolebinding: 'RBAC', serviceaccount: 'RBAC', servicemonitor: 'Observability', prometheusrule: 'Observability', poddisruptionbudget: 'Policy', networkpolicy: 'Policy', configmap: 'Config', secret: 'Config' };
      const catColors = { Workloads: 'var(--red)', Networking: 'var(--accent)', RBAC: 'var(--purple)', Observability: 'var(--green)', Policy: 'var(--orange)', Config: 'var(--cyan)', Other: 'var(--muted)' };
      for (const r of resources) {
        const fname = r.source.file.toLowerCase();
        let cat = 'Other';
        for (const [k, c] of Object.entries(kindMap)) { if (fname.includes(k)) { cat = c; break; } }
        if (!resCats[cat]) resCats[cat] = [];
        resCats[cat].push(r);
      }
      html += `<button class="res-toggle" onclick="var el=document.getElementById('${rid}');if(el.classList.contains('res-collapsed')){el.classList.remove('res-collapsed');this.textContent='Hide resources';}else{el.classList.add('res-collapsed');this.textContent='Show ${resources.length} resources';}">Show ${resources.length} resources</button>`;
      html += `<div id="${rid}" class="res-collapsed" style="margin-top:12px"><div class="res-cat-grid">`;
      for (const [cat, items] of Object.entries(resCats)) {
        html += `<div class="res-cat"><div class="res-cat-label" style="color:${catColors[cat] || 'var(--muted)'}">${cat}</div>
          <div class="res-cat-items">${items.map(r => `<div class="res-cat-item">${r.name}</div>`).join('')}</div></div>`;
      }
      html += '</div></div></div>';
    }

    // 8. Source link
    html += `<div class="td-section"><div style="display:flex;gap:16px;align-items:center">
      <a href="${ghUrl}" target="_blank" style="color:var(--accent);font-size:0.88rem">Browse source on GitHub &#8599;</a>
      <span style="color:var(--muted);font-size:0.82rem">${prefix}</span>
    </div></div>`;

  } else {
    // === GENERIC LAYOUT for non-COMPONENT_INFO sub-components ===
    html += `<div class="td-header">
      <h2 style="text-transform:capitalize">${name} <span class="kind-tag kind-package">sub-component</span></h2>
      <div class="td-id">${prefix}</div>
    </div>`;

    html += '<div class="td-section"><h3>Overview</h3>';
    const pkgEntity = (byKind['package'] || [])[0];
    if (pkgEntity && pkgEntity.description) {
      html += `<div style="padding:14px 18px;background:rgba(88,166,255,0.06);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;margin-bottom:16px;font-size:0.95rem;line-height:1.6;color:var(--text)">${pkgEntity.description}</div>`;
    }

    html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">';
    if (controllers.length > 0) {
      const c = controllers[0];
      html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
        <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--red);margin-bottom:8px;font-weight:600">Controller</div>
        <div style="font-weight:600;font-size:0.95rem;margin-bottom:4px">${c.name}</div>
        <div style="font-family:monospace;font-size:0.8rem;color:var(--muted)">${c.source.file.split('/').pop()}:${c.source.line}</div>
      </div>`;
    }
    const documented = funcs.filter(f => f.description).length;
    const coverage = funcs.length > 0 ? Math.round(documented / funcs.length * 100) : 0;
    html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--green);margin-bottom:8px;font-weight:600">Stats</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${funcs.length ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--accent)">${funcs.length}</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">functions</span></div>` : ''}
        ${tests.length ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--purple)">${tests.length}</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">tests</span></div>` : ''}
        ${resources.length ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--orange)">${resources.length}</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">resources</span></div>` : ''}
        ${documented ? `<div><span style="font-size:1.2rem;font-weight:700;color:var(--text)">${coverage}%</span><span style="font-size:0.78rem;color:var(--muted);margin-left:6px">documented</span></div>` : ''}
      </div>
    </div>`;
    html += `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px">
      <div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:8px;font-weight:600">Source</div>
      <a href="${ghUrl}" target="_blank" style="color:var(--accent);font-size:0.88rem">Browse on GitHub &#8599;</a>
    </div>`;
    html += '</div></div>';

    html += renderEntityList(funcs, 'functions');
    html += renderEntityList(tests, 'tests');
  }

  // Docs
  if (docs.length > 0) {
    html += `<div class="td-section"><h3>Documentation <span class="sec-count">(${docs.length})</span></h3>`;
    for (const e of docs) {
      const docGhUrl = 'https://github.com/openshift/hypershift/blob/main/' + e.source.file;
      html += `<div class="doc-callout" onclick="showEntityDetail('${e.id.replace(/'/g, "\\'")}')">
        <div class="doc-callout-title">${e.name}</div>
        <div class="doc-callout-meta"><a href="${docGhUrl}" target="_blank" style="color:var(--accent)" onclick="event.stopPropagation()">${e.source.file}</a></div>
      </div>`;
    }
    html += '</div>';
  }

  html += '</div>';
  content.innerHTML = html;
  content.scrollTop = 0;
}

function buildDepChain(componentName) {
  const ci = COMPONENT_INFO[componentName];
  if (!ci) return [componentName];
  const chain = [];
  const visited = new Set();
  function trace(name) {
    if (visited.has(name)) return;
    visited.add(name);
    const info = COMPONENT_INFO[name];
    if (info && info.dependsOn) {
      for (const dep of info.dependsOn) trace(dep);
    }
    chain.push(name);
  }
  trace(componentName);
  return chain;
}

// ==================== ENTITY DETAIL ====================

function showEntityDetail(id) {
  const entity = byId[id];
  if (!entity) return;
  const prevContent = document.getElementById('content').innerHTML;
  pushNav(() => { document.getElementById('content').innerHTML = prevContent; document.getElementById('content').scrollTop = 0; });
  const outgoing = relsFrom[id] || [];
  const incoming = relsTo[id] || [];
  const content = document.getElementById('content');
  const ghUrl = 'https://github.com/openshift/hypershift/blob/main/' + entity.source.file;

  const KIND_EXPLAIN = {
    controller: 'A controller is a Go program that watches for changes to a Kubernetes resource and takes action to make the cluster match the desired state. It runs in a loop: watch → compare → act.',
    crd: 'A Custom Resource Definition (CRD) extends the Kubernetes API with a new resource type. You create instances of it like any other Kubernetes object.',
    function: 'A Go function in the HyperShift codebase. Functions implement the actual logic that controllers and operators call.',
    test: 'A Go test that verifies this code works correctly. Tests catch regressions when code changes.',
    package: 'A Go package — a directory of related Go files that can be imported together. Packages organize code by responsibility.',
    resource: 'A Kubernetes resource type that HyperShift creates or manages. These are the actual objects running on the cluster.',
    document: 'A documentation file in the HyperShift repository. Contains guides, design docs, or operational runbooks.',
  };

  let html = '<div class="topic-detail">';
  html += '<button class="back-btn" onclick="goBack()">Back</button>';
  html += `<div class="td-header">
    <h2>${entity.name} <span class="kind-tag kind-${entity.kind}">${entity.kind}</span></h2>
  </div>`;

  // What is this? — description first, prominently
  if (entity.description) {
    const highlightedDesc = entity.description.replace(new RegExp('\\b' + entity.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'g'),
      `<span style="color:var(--accent);font-weight:600">${entity.name}</span>`);
    html += '<div class="td-section">';
    html += '<h3>What is this?</h3>';
    html += `<p style="font-size:0.95rem;line-height:1.7;color:var(--text);margin-bottom:12px">${highlightedDesc}</p>`;
    html += '</div>';
  }

  // Kind explainer — what does "controller" / "crd" etc. even mean
  if (KIND_EXPLAIN[entity.kind]) {
    html += `<div style="background:rgba(88,166,255,0.05);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:20px">`;
    html += `<div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:600;margin-bottom:4px">What is a ${entity.kind}?</div>`;
    html += `<div style="font-size:0.85rem;color:var(--text);line-height:1.6;opacity:0.9">${KIND_EXPLAIN[entity.kind]}</div>`;
    html += '</div>';
  }

  // Controller-specific: link to the topic it reconciles
  if (entity.kind === 'controller') {
    const myTopic = topics.find(t => t.controller && t.controller.id === id);
    if (myTopic) {
      html += '<div class="td-section"><h3>Reconciles</h3>';
      html += `<div class="info-card" onclick="showTopicDetail('${myTopic.crd.id.replace(/'/g, "\\'")}')">`;
      html += `<div class="ic-title">${myTopic.crd.name} <span class="kind-tag kind-crd">CRD</span></div>`;
      html += `<div class="ic-desc" style="margin-top:4px">This controller watches for ${myTopic.crd.name} resources and reconciles them. Click to see the full topic page with architecture and relationships.</div>`;
      html += '</div></div>';
    } else {
      const reconciles = outgoing.filter(r => r.type === 'reconciles');
      if (reconciles.length > 0) {
        html += '<div class="td-section"><h3>Reconciles</h3>';
        for (const r of reconciles) {
          const target = byId[r.to];
          if (target) {
            html += `<div class="info-card" onclick="showTopicDetailOrEntity('${r.to.replace(/'/g, "\\'")}')">`;
            html += `<div class="ic-title">${target.name} <span class="kind-tag kind-${target.kind}">${target.kind}</span></div>`;
            html += '</div>';
          }
        }
        html += '</div>';
      }
    }
  }

  // Watches — what resources this entity monitors
  if (entity.watches && entity.watches.length > 0) {
    html += '<div class="td-section"><h3>Watches these resources</h3>';
    html += `<p style="font-size:0.82rem;color:var(--muted);margin-bottom:10px">This ${entity.kind} reacts to changes on these Kubernetes resource types:</p>`;
    html += '<div class="watches-row">';
    for (const w of entity.watches) {
      const we = graph.entities.find(e => (e.kind === 'crd' || e.kind === 'resource') && e.name === w);
      if (we) {
        html += `<span class="watch-tag" onclick="showTopicDetailOrEntity('${we.id.replace(/'/g, "\\'")}')">${w}</span>`;
      } else {
        html += `<span class="watch-tag">${w}</span>`;
      }
    }
    html += '</div></div>';
  }

  // Implements — what interfaces this entity's type satisfies
  if (entity.implements && entity.implements.length > 0) {
    html += '<div class="td-section"><h3>Implements</h3>';
    html += `<p style="font-size:0.82rem;color:var(--muted);margin-bottom:10px">This type satisfies these interfaces (detected via <code>var _ Interface = &amp;Struct{}</code>):</p>`;
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
    for (const iface of entity.implements) {
      const ifaceEntity = graph.entities.find(e => e.name === iface);
      if (ifaceEntity) {
        html += `<span class="impl-tag" onclick="showEntityDetail('${ifaceEntity.id.replace(/'/g, "\\'")}')">${iface}</span>`;
      } else {
        html += `<span class="impl-tag" style="cursor:default">${iface}</span>`;
      }
    }
    html += '</div></div>';
  }

  // Env vars — environment variables read by this function
  if (entity.env_vars && entity.env_vars.length > 0) {
    html += '<div class="td-section"><h3>Environment Variables <span class="sec-count">(' + entity.env_vars.length + ')</span></h3>';
    html += `<p style="font-size:0.82rem;color:var(--muted);margin-bottom:10px">This function reads these env vars via <code>os.Getenv()</code>:</p>`;
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
    for (const ev of entity.env_vars) {
      html += `<span class="envvar-tag">${ev}</span>`;
    }
    html += '</div></div>';
  }

  // Function calls — what this function calls (for non-controller function entities)
  if (entity.kind === 'function' && entity.calls && entity.calls.length > 0) {
    const callRels = outgoing.filter(r => r.type === 'calls');
    const resolvedCalls = {};
    for (const r of callRels) {
      const target = byId[r.to];
      if (target) resolvedCalls[target.name] = target;
    }
    const internalCalls = [];
    const externalCalls = [];
    const unresolvedCalls = [];
    for (const name of entity.calls) {
      const target = resolvedCalls[name];
      if (target && target.package === entity.package) {
        internalCalls.push({ name, target });
      } else if (target) {
        externalCalls.push({ name, target });
      } else {
        unresolvedCalls.push({ name });
      }
    }
    html += '<div class="td-section"><h3>Calls <span class="sec-count">(' + entity.calls.length + ')</span></h3>';
    html += '<div class="func-calls-flow">';
    if (internalCalls.length > 0) {
      html += '<div style="width:100%;margin-bottom:4px"><span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--red);font-weight:600">Same package (' + (entity.package || '') + ')</span></div>';
      for (const call of internalCalls) {
        html += `<div class="recon-step internal" onclick="showEntityDetail('${call.target.id.replace(/'/g, "\\'")}')">${call.name}</div>`;
      }
    }
    if (externalCalls.length > 0) {
      html += '<div style="width:100%;margin-top:8px;margin-bottom:4px"><span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);font-weight:600">External</span></div>';
      for (const call of externalCalls) {
        html += `<div class="recon-step external" onclick="showEntityDetail('${call.target.id.replace(/'/g, "\\'")}')">${call.name} <span style="font-size:0.7rem;color:var(--muted)">${call.target.package}</span></div>`;
      }
    }
    if (unresolvedCalls.length > 0) {
      html += '<div style="width:100%;margin-top:8px;margin-bottom:4px"><span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600">Unresolved</span></div>';
      for (const call of unresolvedCalls) {
        html += `<div class="recon-step unresolved">${call.name}</div>`;
      }
    }
    html += '</div></div>';
  }

  // Imports — what packages this entity imports (for package entities)
  if (entity.imports && entity.imports.length > 0) {
    const stdLib = entity.imports.filter(i => !i.includes('.'));
    const external = entity.imports.filter(i => i.includes('.'));
    html += '<div class="td-section"><h3>Imports <span class="sec-count">(' + entity.imports.length + ')</span></h3>';
    if (external.length > 0) {
      html += '<div style="margin-bottom:8px"><span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);font-weight:600">External (' + external.length + ')</span></div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">';
      for (const imp of external) {
        html += `<span class="envvar-tag" style="background:rgba(57,210,192,0.12);color:var(--cyan);border-color:rgba(57,210,192,0.25)">${imp}</span>`;
      }
      html += '</div>';
    }
    if (stdLib.length > 0) {
      html += '<div style="margin-bottom:8px"><span style="font-size:0.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600">Standard Library (' + stdLib.length + ')</span></div>';
      html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
      for (const imp of stdLib) {
        html += `<span class="envvar-tag" style="background:rgba(139,148,158,0.12);color:var(--muted);border-color:rgba(139,148,158,0.25)">${imp}</span>`;
      }
      html += '</div>';
    }
    html += '</div>';
  }

  // Document-specific sections
  if (entity.kind === 'document') {
    const docName = entity.name.replace(/\.md$/, '').toLowerCase();
    const docPath = (entity.source.file || '').toLowerCase();
    const relatedTopics = topics.filter(t => {
      if (!t.crd) return false;
      const crdName = t.crd.name.toLowerCase();
      return docName.includes(crdName) || docPath.includes(crdName) ||
             (t.controller && (docName.includes(t.controller.name.toLowerCase()) || docPath.includes((t.controller.package || '').toLowerCase())));
    });
    if (relatedTopics.length > 0) {
      html += `<div class="td-section"><h3>Related Topics</h3>`;
      for (const t of relatedTopics) {
        html += `<div class="info-card" onclick="showTopicDetail('${t.crd.id.replace(/'/g, "\\'")}')">
          <div class="ic-title">${t.crd.name} <span class="kind-tag kind-crd">CRD</span></div>
          ${t.controller ? `<div class="ic-meta">controller: ${t.controller.name}</div>` : ''}
        </div>`;
      }
      html += '</div>';
    }
    if (entity.description) {
      const headings = entity.description.split('; ').filter(h => h.trim());
      html += '<div class="td-section"><h3>Document Sections <span class="sec-count">(' + headings.length + ')</span></h3>';
      html += '<div class="doc-toc"><ul>';
      const shown = headings.slice(0, 30);
      for (const h of shown) html += `<li><span class="toc-bullet">&bull;</span> ${h}</li>`;
      if (headings.length > 30) html += `<li class="toc-ellipsis">... and ${headings.length - 30} more sections</li>`;
      html += '</ul></div></div>';
    }
  }

  // Connections — renamed from Outgoing/Incoming, grouped by type
  const allRels = [
    ...outgoing.map(r => ({ ...r, dir: 'out', other: byId[r.to], otherId: r.to })),
    ...incoming.map(r => ({ ...r, dir: 'in', other: byId[r.from], otherId: r.from }))
  ].filter(r => !(entity.kind === 'controller' && r.type === 'reconciles' && r.dir === 'out'));
  if (allRels.length > 0) {
    const grouped = {};
    for (const r of allRels) {
      const label = r.type + (r.dir === 'in' ? ' (by)' : '');
      if (!grouped[label]) grouped[label] = [];
      grouped[label].push(r);
    }
    html += '<div class="td-section"><h3>Connections <span class="sec-count">(' + allRels.length + ')</span></h3>';
    for (const [label, rels] of Object.entries(grouped)) {
      html += `<div style="margin-bottom:12px"><div style="font-size:0.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:6px">${label}</div>`;
      for (const r of rels) {
        const name = r.other ? r.other.name : r.otherId;
        const kind = r.other ? r.other.kind : '';
        html += `<div class="info-card" onclick="showTopicDetailOrEntity('${r.otherId.replace(/'/g, "\\'")}')">
          <div class="ic-title">${name} ${kind ? `<span class="kind-tag kind-${kind}">${kind}</span>` : ''}</div>
          ${r.evidence.reason ? `<div class="ic-desc">${r.evidence.reason}</div>` : ''}
        </div>`;
      }
      html += '</div>';
    }
    html += '</div>';
  } else if (!entity.watches || entity.watches.length === 0) {
    html += '<div class="td-section"><p style="color:var(--muted)">No connections found in the codebase.</p></div>';
  }

  // Source — always show at bottom
  html += '<div class="td-section"><h3>Source</h3>';
  html += '<div class="prop-grid">';
  html += `<span class="prop-key">Package</span><span class="prop-val">${entity.package || 'N/A'}</span>`;
  html += `<span class="prop-key">File</span><span class="prop-val"><a href="${ghUrl}" target="_blank" rel="noopener" style="color:var(--accent)">${entity.source.file}:${entity.source.line}</a></span>`;
  if (entity.lastAuthor) {
    html += `<span class="prop-key">Last Author</span><span class="prop-val">${entity.lastAuthor}</span>`;
  }
  if (entity.lastModified) {
    const d = new Date(entity.lastModified);
    const ago = Math.floor((Date.now() - d) / 86400000);
    html += `<span class="prop-key">Last Modified</span><span class="prop-val">${d.toLocaleDateString()} <span style="color:var(--muted)">(${ago}d ago)</span></span>`;
  }
  if (entity.changeCount) {
    html += `<span class="prop-key">Changes</span><span class="prop-val">${entity.changeCount} commits</span>`;
  }
  html += '</div></div>';

  html += '</div>';
  content.innerHTML = html;
  content.scrollTop = 0;
}

let navHistory = [];

function pushNav(fn) {
  navHistory.push(fn);
}

function goBack() {
  if (navHistory.length > 0) {
    const prev = navHistory.pop();
    prev();
  } else {
    showTopics();
  }
}

// ==================== LIST VIEW ====================

function getFiltered() {
  let entities = graph.entities;
  if (currentKind !== 'all') entities = entities.filter(e => e.kind === currentKind);
  const q = document.getElementById('search').value.toLowerCase().trim();
  if (q) {
    entities = entities.filter(e =>
      e.name.toLowerCase().includes(q) ||
      (e.package || '').toLowerCase().includes(q) ||
      (e.source.file || '').toLowerCase().includes(q) ||
      (e.env_vars || []).some(v => v.toLowerCase().includes(q)) ||
      (e.implements || []).some(v => v.toLowerCase().includes(q)) ||
      (e.imports || []).some(v => v.toLowerCase().includes(q))
    );
  }
  return entities;
}

function renderList() {
  currentView = 'list';
  const content = document.getElementById('content');
  const entities = getFiltered();
  const totalPages = Math.ceil(entities.length / PAGE_SIZE);
  const page = entities.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);

  if (entities.length === 0) { content.innerHTML = '<div class="no-results">No entities match.</div>'; return; }

  let html = '<div class="list-header"><span>Name</span><span>Package</span><span>File</span></div>';
  for (const e of page) {
    const file = e.source.file || '';
    const shortFile = file.split('/').slice(-2).join('/');
    html += `<div class="entity-row" onclick="showEntityDetail('${e.id.replace(/'/g, "\\'")}')">
      <div><span class="e-name">${e.name}</span><span class="kind-tag kind-${e.kind}">${e.kind}</span>${(e.env_vars && e.env_vars.length > 0) ? `<span style="font-size:0.65rem;padding:2px 6px;border-radius:3px;background:rgba(210,153,34,0.15);color:var(--orange);margin-left:4px">${e.env_vars.length} env</span>` : ''}${(e.implements && e.implements.length > 0) ? `<span style="font-size:0.65rem;padding:2px 6px;border-radius:3px;background:rgba(188,140,255,0.15);color:var(--purple);margin-left:4px">impl</span>` : ''}${(e.imports && e.imports.length > 0) ? `<span style="font-size:0.65rem;padding:2px 6px;border-radius:3px;background:rgba(57,210,192,0.15);color:var(--cyan);margin-left:4px">${e.imports.length} imp</span>` : ''}${e.changeCount ? `<span style="font-size:0.65rem;padding:2px 6px;border-radius:3px;background:rgba(88,166,255,0.15);color:var(--accent);margin-left:4px">${e.changeCount}x</span>` : ''}</div>
      <div class="e-pkg">${e.package || ''}</div>
      <div class="e-file" title="${file}:${e.source.line}">${shortFile}:${e.source.line}</div>
    </div>`;
  }
  if (totalPages > 1) {
    html += `<div class="pagination">
      <button onclick="currentPage--;renderList();document.getElementById('content').scrollTop=0" ${currentPage === 0 ? 'disabled' : ''}>Prev</button>
      <span>Page ${currentPage + 1} of ${totalPages} (${entities.length.toLocaleString()})</span>
      <button onclick="currentPage++;renderList();document.getElementById('content').scrollTop=0" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>Next</button>
    </div>`;
  }
  content.innerHTML = html;
}

// ==================== SEARCH ====================

document.getElementById('search').addEventListener('input', function() {
  currentPage = 0;
  if (currentView === 'topics') showTopics();
  else renderList();
});

loadGraph();
</script>
